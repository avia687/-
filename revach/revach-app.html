<style>
/* ============================================================
   רווח — mobile earnings tracker. Self-contained, no libraries.
   ============================================================ */

:root {
  --green: #0e9f6e;
  --green-dark: #057a55;
  --green-soft: #def7ec;
  --amber: #c27803;
  --amber-soft: #fdf6b2;
  --red: #e02424;
  --red-soft: #fde8e8;
  --blue: #1c64f2;
  --purple: #7e3af2;

  --bg: #f3f4f6;
  --card: #ffffff;
  --card-2: #f9fafb;
  --text: #111827;
  --text-soft: #6b7280;
  --text-faint: #9ca3af;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 64px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f14;
    --card: #161b22;
    --card-2: #1c232c;
    --text: #f3f4f6;
    --text-soft: #9ba3af;
    --text-faint: #6b7280;
    --border: #2a323c;
    --green-soft: #04372a;
    --amber-soft: #3a2f04;
    --red-soft: #3a1414;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Rubik, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body { overflow-x: hidden; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
}

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px calc(14px);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: #fff;
  box-shadow: 0 2px 10px rgba(5,122,85,.25);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
.brand-logo { font-size: 22px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: rgba(255,255,255,.18); font-size: 18px;
  display: grid; place-items: center;
}
.icon-btn:active { transform: scale(.93); }

/* ---------- Screens ---------- */
.screen { animation: fade .25s ease; }
.screen.hidden { display: none; }
.screen-inner { padding: 16px 16px 8px; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.section-title {
  font-size: 15px; font-weight: 700; color: var(--text-soft);
  margin: 22px 4px 10px; display: flex; align-items: center; gap: 6px;
}

/* ---------- Cards ---------- */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px;
}

/* Hero card (home) */
.hero {
  background: linear-gradient(140deg, var(--green), var(--green-dark));
  color: #fff; border-radius: 24px; padding: 22px;
  box-shadow: 0 12px 30px rgba(5,122,85,.35);
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; left: -30px; bottom: -50px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,255,255,.12);
}
.hero-label { font-size: 14px; opacity: .9; font-weight: 600; }
.hero-amount { font-size: 42px; font-weight: 900; letter-spacing: -1px; margin: 4px 0 2px; }
.hero-sub { font-size: 14px; opacity: .92; display: flex; align-items: center; gap: 6px; }
.hero-stats { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero-stat {
  flex: 1; background: rgba(255,255,255,.16); border-radius: 14px;
  padding: 10px 12px; backdrop-filter: blur(4px);
}
.hero-stat .v { font-size: 18px; font-weight: 800; }
.hero-stat .l { font-size: 12px; opacity: .9; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
}
.pill.up { background: rgba(255,255,255,.22); }
.pill.down { background: rgba(0,0,0,.18); }

/* Insight tiles */
.insight {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 15px 16px; margin-bottom: 12px;
}
.insight-ico {
  width: 46px; height: 46px; border-radius: 14px; flex: none;
  display: grid; place-items: center; font-size: 22px;
}
.insight-txt { flex: 1; min-width: 0; }
.insight-txt .t { font-size: 15px; font-weight: 700; }
.insight-txt .s { font-size: 13px; color: var(--text-soft); margin-top: 2px; }

.bg-green { background: var(--green-soft); }
.bg-amber { background: var(--amber-soft); }
.bg-red   { background: var(--red-soft); }
.bg-blue  { background: #e1effe; }
.bg-purple{ background: #f0e6fd; }
@media (prefers-color-scheme: dark) {
  .bg-blue { background: #0b2a5b; } .bg-purple { background: #2a1259; }
}

/* ---------- Goals ---------- */
.goal-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
}
.goal-top { display: flex; align-items: center; gap: 12px; }
.goal-emoji {
  width: 48px; height: 48px; border-radius: 14px; flex: none;
  background: var(--card-2); display: grid; place-items: center; font-size: 26px;
}
.goal-name { font-weight: 800; font-size: 16px; }
.goal-meta { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.goal-del { color: var(--text-faint); font-size: 18px; padding: 4px 8px; }
.progress-track {
  height: 12px; background: var(--card-2); border-radius: 999px;
  overflow: hidden; margin: 14px 0 8px; border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--green), #34d399);
  transition: width .5s cubic-bezier(.2,.8,.2,1);
}
.goal-nums { display: flex; justify-content: space-between; font-size: 13.5px; }
.goal-nums .saved { font-weight: 800; color: var(--green); }
.goal-nums .left { color: var(--text-soft); }
.goal-eta { font-size: 12.5px; color: var(--text-soft); margin-top: 8px; display: flex; gap: 5px; align-items: center; }
.goal-done-badge {
  background: var(--green); color: #fff; font-size: 12px; font-weight: 800;
  padding: 3px 10px; border-radius: 999px;
}

/* ---------- Job rows ---------- */
.job-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 10px;
}
.job-avatar {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 18px; font-weight: 800;
  background: var(--card-2); color: var(--green);
}
.job-main { flex: 1; min-width: 0; }
.job-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.job-right { text-align: left; flex: none; }
.job-amount { font-weight: 800; font-size: 15.5px; }
.status-chip {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; margin-top: 3px;
}
.status-paid { background: var(--green-soft); color: var(--green-dark); }
.status-unpaid { background: var(--amber-soft); color: var(--amber); }
@media (prefers-color-scheme: dark) {
  .status-paid { color: #34d399; } .status-unpaid { color: #fbbf24; }
}

.date-group-label { font-size: 13px; font-weight: 700; color: var(--text-faint); margin: 16px 4px 8px; }

/* ---------- Charts ---------- */
.chart-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
.chart-title { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
.chart-note { font-size: 12.5px; color: var(--text-soft); margin-bottom: 14px; }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 150px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #34d399, var(--green)); transition: height .5s ease; min-height: 3px; }
.bar.dim { background: linear-gradient(180deg, #cbd5e1, #94a3b8); opacity: .55; }
.bar-val { font-size: 10.5px; font-weight: 700; color: var(--text-soft); }
.bar-lbl { font-size: 11px; color: var(--text-faint); }

.hbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.hbar-name { width: 78px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { flex: 1; height: 22px; background: var(--card-2); border-radius: 8px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 8px; display: flex; align-items: center; padding-inline-start: 8px; color: #fff; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.hbar-val { width: 62px; text-align: left; font-size: 12.5px; font-weight: 700; }

.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut { width: 120px; height: 120px; flex: none; }
.donut-legend { flex: 1; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13.5px; }
.legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.legend-row b { margin-inline-start: auto; }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 40px 20px; }
.empty-emoji { font-size: 54px; }
.empty-title { font-size: 18px; font-weight: 800; margin: 12px 0 6px; }
.empty-text { font-size: 14px; color: var(--text-soft); line-height: 1.5; max-width: 300px; margin: 0 auto 18px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 14px; font-size: 16px; font-weight: 800;
  width: 100%; transition: transform .1s ease;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; box-shadow: 0 6px 16px rgba(5,122,85,.3); }
.btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-sm { padding: 10px 16px; font-size: 14px; width: auto; }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  max-width: 520px; margin: 0 auto;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  box-shadow: 0 -2px 16px rgba(0,0,0,.06);
}
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--text-faint); }
.nav-btn .nav-ico { font-size: 21px; filter: grayscale(.4); opacity: .6; transition: .15s; }
.nav-btn .nav-lbl { font-size: 11px; font-weight: 700; }
.nav-btn.active { color: var(--green); }
.nav-btn.active .nav-ico { filter: none; opacity: 1; transform: translateY(-1px); }
.fab {
  width: 60px; height: 60px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: #fff; font-size: 34px; font-weight: 300; line-height: 1;
  display: grid; place-items: center; margin-top: -26px;
  box-shadow: 0 8px 20px rgba(5,122,85,.45); border: 4px solid var(--bg);
}
.fab:active { transform: scale(.92); }

/* ---------- Sheet / modal ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; animation: fade .2s; }
.sheet-backdrop.hidden, .sheet.hidden { display: none; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  max-width: 520px; margin: 0 auto;
  background: var(--card); border-radius: 24px 24px 0 0;
  box-shadow: var(--shadow-lg); padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  max-height: 92vh; overflow-y: auto; animation: slideup .28s cubic-bezier(.2,.9,.25,1);
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.sheet-handle { width: 40px; height: 5px; border-radius: 999px; background: var(--border); margin: 8px auto 6px; }
.sheet-title { font-size: 20px; font-weight: 900; margin: 6px 0 18px; }

/* ---------- Form ---------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 7px; color: var(--text-soft); }
.field input[type=text], .field input[type=number], .field input[type=date], .field select {
  width: 100%; padding: 14px; border-radius: 13px; font-size: 16px;
  background: var(--card-2); color: var(--text); border: 1.5px solid var(--border);
  transition: border-color .15s;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--green); }
.field .hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
.row2 { display: flex; gap: 12px; }
.row2 > .field { flex: 1; }

.amount-input-wrap { position: relative; }
.amount-input-wrap .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; font-weight: 800; color: var(--text-faint); pointer-events: none; }
.amount-input-wrap input { font-size: 24px !important; font-weight: 800; text-align: right; padding-left: 40px !important; }

/* toggle */
.toggle-group { display: flex; gap: 10px; }
.toggle-opt {
  flex: 1; text-align: center; padding: 13px; border-radius: 13px;
  background: var(--card-2); border: 1.5px solid var(--border);
  font-weight: 700; font-size: 14px; transition: .15s;
}
.toggle-opt.on { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
@media (prefers-color-scheme: dark) { .toggle-opt.on { color: #34d399; } }

.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.emoji-opt {
  width: 46px; height: 46px; border-radius: 12px; font-size: 24px;
  background: var(--card-2); border: 1.5px solid var(--border);
  display: grid; place-items: center; transition: .12s;
}
.emoji-opt.on { border-color: var(--green); background: var(--green-soft); transform: scale(1.05); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  background: var(--card-2); border: 1.5px solid var(--border);
}
.chip:active { transform: scale(.95); }

/* Toast */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 24px); left: 50%; transform: translateX(-50%) translateY(20px);
  background: #111827; color: #fff; padding: 12px 20px; border-radius: 999px;
  font-size: 14px; font-weight: 700; z-index: 100; opacity: 0; transition: .25s;
  box-shadow: var(--shadow-lg); pointer-events: none; max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.hidden { display: none; }

.mini-goal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
.mini-goal { background: rgba(255,255,255,.16); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; }

/* optional-field label tag */
.opt { font-weight: 400; color: var(--text-faint); font-size: 12px; }

/* Payment reminder card */
.alert-card { border: 1.5px solid var(--amber); background: linear-gradient(180deg, var(--amber-soft), var(--card)); }
.alert-head b { font-size: 16px; }
.alert-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.pay-list { margin-top: 12px; }
.pay-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.pay-main { flex: 1; min-width: 0; }
.pay-title { font-size: 14.5px; font-weight: 700; }
.pay-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.late-badge { background: var(--red); color: #fff; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-inline-start: 4px; }
.pay-btn { flex: none; background: var(--green); color: #fff; font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 10px; }
.pay-btn:active { transform: scale(.94); }
.row-pay { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--green-soft); color: var(--green-dark); font-size: 16px; font-weight: 900; display: grid; place-items: center; }
@media (prefers-color-scheme: dark) { .row-pay { color: #34d399; } }
.row-pay:active { transform: scale(.9); }

/* filter chips */
.chip-on { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); }
@media (prefers-color-scheme: dark) { .chip-on { color: #34d399; } }

/* Monthly report */
.mr-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.mr-arrow { width: 38px; height: 38px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); font-size: 22px; font-weight: 800; color: var(--text); display: grid; place-items: center; }
.mr-arrow:active { transform: scale(.9); }
.mr-arrow.disabled { opacity: .3; pointer-events: none; }
.mr-title { text-align: center; }
.mr-month { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
.mr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.mr-stat { background: var(--card-2); border-radius: 14px; padding: 12px; text-align: center; }
.mr-v { font-size: 20px; font-weight: 900; }
.mr-l { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

/* share preview */
.report-preview {
  background: var(--card-2); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap;
  font-family: inherit; max-height: 40vh; overflow-y: auto; margin: 0;
}

.link-btn { color: var(--green); font-weight: 700; font-size: 14px; padding: 6px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; }


/* Explicit theme-toggle support (Artifact stamps data-theme on :root) */
:root[data-theme="light"]{--bg:#f3f4f6;--card:#fff;--card-2:#f9fafb;--text:#111827;--text-soft:#6b7280;--text-faint:#9ca3af;--border:#e5e7eb;--green-soft:#def7ec;--amber-soft:#fdf6b2;--red-soft:#fde8e8;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.12);}
:root[data-theme="dark"]{--bg:#0b0f14;--card:#161b22;--card-2:#1c232c;--text:#f3f4f6;--text-soft:#9ba3af;--text-faint:#6b7280;--border:#2a323c;--green-soft:#04372a;--amber-soft:#3a2f04;--red-soft:#3a1414;--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);}
:root[data-theme="dark"] .bg-blue{background:#0b2a5b;}:root[data-theme="dark"] .bg-purple{background:#2a1259;}
:root[data-theme="dark"] .status-paid{color:#34d399;}:root[data-theme="dark"] .status-unpaid{color:#fbbf24;}
:root[data-theme="dark"] .toggle-opt.on{color:#34d399;}
:root[data-theme="light"] .bg-blue{background:#e1effe;}:root[data-theme="light"] .bg-purple{background:#f0e6fd;}

/* keep app contained within artifact frame */
#revach-root #app{min-height:100vh;}
</style>
<script>
/* ============================================================
   רווח (Revach) — track your work & earnings, get insights,
   and save toward goals. 100% client-side, data in localStorage.
   ============================================================ */

'use strict';

/* -------------------- Storage -------------------- */
const KEY = {
  jobs: 'revach_jobs_v1',
  goals: 'revach_goals_v1',
  settings: 'revach_settings_v1',
};

const store = {
  load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  },
  save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage may be blocked */ } },
};

let jobs = store.load(KEY.jobs, []);
let goals = store.load(KEY.goals, []);
let settings = store.load(KEY.settings, { weeklyGoal: 0, currency: '₪' });

function persist() {
  store.save(KEY.jobs, jobs);
  store.save(KEY.goals, goals);
  store.save(KEY.settings, settings);
}

/* -------------------- Helpers -------------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CUR = () => settings.currency || '₪';

function money(n) {
  const rounded = Math.round(Number(n) || 0);
  return CUR() + rounded.toLocaleString('he-IL');
}
function moneyShort(n) {
  n = Math.round(Number(n) || 0);
  if (n >= 1000) return CUR() + (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'K';
  return CUR() + n;
}

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const DAY_SHORT = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const MONTHS = ['ינו׳', 'פבר׳', 'מרץ', 'אפר׳', 'מאי', 'יוני', 'יולי', 'אוג׳', 'ספט׳', 'אוק׳', 'נוב׳', 'דצמ׳'];
const MONTHS_FULL = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

function todayISO() { return toISO(new Date()); }
function toISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

// Week starts on Sunday (Israel)
function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - x.getDay());
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function sameDay(a, b) { return toISO(a) === toISO(b); }

function niceDate(iso) {
  const d = parseISO(iso), t = new Date();
  if (sameDay(d, t)) return 'היום';
  if (sameDay(d, addDays(t, -1))) return 'אתמול';
  return `${d.getDate()} ב${MONTHS[d.getMonth()]}`;
}

function sum(arr, f) { return arr.reduce((s, x) => s + (f ? f(x) : x), 0); }
function daysAgo(iso) { return Math.floor((Date.now() - parseISO(iso).getTime()) / 864e5); }
function jobNet(j) { return (Number(j.amount) || 0) - (Number(j.expenses) || 0); }

/* -------------------- Goal allocation --------------------
   Each goal saves from every job:
   - type 'percent': contribution = amount * value/100
   - type 'fixed':   contribution = min(value, amount)
   Saved is the sum of contributions across all jobs, capped at target.
--------------------------------------------------------- */
function goalContribution(goal, job) {
  const amt = Number(job.amount) || 0;
  if (goal.type === 'percent') return amt * (Number(goal.value) || 0) / 100;
  return Math.min(Number(goal.value) || 0, amt);
}
function goalSaved(goal) {
  const raw = sum(jobs, j => goalContribution(goal, j));
  return Math.min(raw, Number(goal.target) || 0);
}
function goalRawSaved(goal) { return sum(jobs, j => goalContribution(goal, j)); }

// Average weekly contribution to estimate ETA
function weeklyContribution(goal) {
  if (!jobs.length) return 0;
  const dates = jobs.map(j => parseISO(j.date).getTime());
  const span = Math.max(1, (Math.max(...dates) - Math.min(...dates)) / (7 * 864e5));
  return goalRawSaved(goal) / span;
}

/* -------------------- Stats -------------------- */
function weekRange(offset = 0) {
  const start = addDays(startOfWeek(new Date()), offset * 7);
  return { start, end: addDays(start, 7) };
}
function jobsInRange(start, end) {
  return jobs.filter(j => { const d = parseISO(j.date); return d >= start && d < end; });
}
function weekTotal(offset = 0) {
  const { start, end } = weekRange(offset);
  return sum(jobsInRange(start, end), j => Number(j.amount) || 0);
}

function stats() {
  const thisWeek = weekTotal(0);
  const lastWeek = weekTotal(-1);
  const thisWeekJobs = jobsInRange(weekRange(0).start, weekRange(0).end);
  const unpaid = sum(jobs.filter(j => !j.paid), j => Number(j.amount) || 0);
  const total = sum(jobs, j => Number(j.amount) || 0);
  const totalExpenses = sum(jobs, j => Number(j.expenses) || 0);
  const netTotal = total - totalExpenses;
  const hoursJobs = jobs.filter(j => Number(j.hours) > 0);
  const totalHours = sum(hoursJobs, j => Number(j.hours) || 0);
  const hourlyRate = totalHours > 0 ? sum(hoursJobs, j => Number(j.amount) || 0) / totalHours : 0;
  const unpaidJobs = jobs.filter(j => !j.paid).sort((a, b) => a.date.localeCompare(b.date));

  // change %
  let change = null;
  if (lastWeek > 0) change = Math.round((thisWeek - lastWeek) / lastWeek * 100);
  else if (thisWeek > 0) change = 100;

  // most profitable weekday (all time)
  const byDay = [0, 0, 0, 0, 0, 0, 0];
  jobs.forEach(j => { byDay[parseISO(j.date).getDay()] += Number(j.amount) || 0; });
  let bestDay = null, bestDayVal = 0;
  byDay.forEach((v, i) => { if (v > bestDayVal) { bestDayVal = v; bestDay = i; } });

  // top client (all time)
  const byClient = {};
  jobs.forEach(j => { const c = (j.client || '').trim() || 'ללא לקוח'; byClient[c] = (byClient[c] || 0) + (Number(j.amount) || 0); });
  const clientArr = Object.entries(byClient).sort((a, b) => b[1] - a[1]);
  const topClient = clientArr[0] || null;

  return { thisWeek, lastWeek, change, unpaid, total, totalExpenses, netTotal, totalHours, hourlyRate, unpaidJobs, thisWeekJobs, byDay, bestDay, bestDayVal, byClient, clientArr, topClient };
}

/* ==========================================================
   RENDERING
   ========================================================== */
const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function inner(screen) { return $(`#screen-${screen} .screen-inner`); }

/* ---------- HOME ---------- */
function renderHome() {
  const c = inner('home'); c.innerHTML = '';
  const s = stats();

  if (jobs.length === 0) {
    c.appendChild(emptyState(
      '👋', 'ברוך הבא לרווח!',
      'כאן תרכז את כל העבודות שעשית, תראה כמה הרווחת, ותחסוך למטרות שלך. בוא נתחיל — הוסף עבודה ראשונה.',
      'הוספת עבודה ראשונה', () => openJobSheet()
    ));
    const demo = el('button', 'link-btn center', 'או טען נתוני דוגמה כדי לראות איך זה עובד');
    demo.style.display = 'block'; demo.style.margin = '4px auto';
    demo.onclick = loadDemo;
    c.appendChild(demo);
    return;
  }

  // Hero
  const hero = el('div', 'hero');
  const changeHtml = s.change === null ? '' :
    `<span class="pill ${s.change >= 0 ? 'up' : 'down'}">${s.change >= 0 ? '▲' : '▼'} ${Math.abs(s.change)}%</span>`;
  const changeText = s.change === null ? 'השבוע הראשון שלך 🎉'
    : s.change >= 0 ? 'יותר מהשבוע שעבר' : 'פחות מהשבוע שעבר';
  hero.innerHTML = `
    <div class="hero-label">הרווחת השבוע</div>
    <div class="hero-amount">${money(s.thisWeek)}</div>
    <div class="hero-sub">${changeHtml} <span>${changeText}</span></div>
    <div class="hero-stats">
      <div class="hero-stat"><div class="v">${s.thisWeekJobs.length}</div><div class="l">עבודות השבוע</div></div>
      <div class="hero-stat"><div class="v">${money(s.unpaid)}</div><div class="l">ממתין לתשלום</div></div>
    </div>`;

  // mini goal badges in hero
  if (goals.length) {
    const badges = el('div', 'mini-goal-badges');
    goals.slice(0, 3).forEach(g => {
      const pct = Math.min(100, Math.round(goalSaved(g) / (g.target || 1) * 100));
      badges.appendChild(el('div', 'mini-goal', `${g.emoji} ${pct}%`));
    });
    hero.appendChild(badges);
  }
  c.appendChild(hero);

  // Payment reminders
  const alertCard = paymentsAlertCard(s);
  if (alertCard) c.appendChild(alertCard);

  // Weekly goal progress (if set)
  if (settings.weeklyGoal > 0) {
    const pct = Math.min(100, Math.round(s.thisWeek / settings.weeklyGoal * 100));
    const left = Math.max(0, settings.weeklyGoal - s.thisWeek);
    const card = el('div', 'card');
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>🎯 יעד שבועי</b>
        <span style="font-size:13px;color:var(--text-soft)">${money(s.thisWeek)} / ${money(settings.weeklyGoal)}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:13px;color:var(--text-soft)">${left > 0 ? `עוד ${money(left)} ליעד השבועי 💪` : 'הגעת ליעד השבועי! 🎉'}</div>`;
    c.appendChild(card);
  }

  // Insights
  c.appendChild(el('div', 'section-title', '💡 תובנות'));
  insightTiles(s).forEach(t => c.appendChild(t));

  // Recent jobs preview
  c.appendChild(el('div', 'section-title', '📋 עבודות אחרונות'));
  const recent = [...jobs].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created).slice(0, 3);
  recent.forEach(j => c.appendChild(jobRow(j)));
  const seeAll = el('button', 'link-btn center', 'לכל העבודות ←');
  seeAll.style.cssText = 'display:block;margin:2px auto 8px';
  seeAll.onclick = () => nav('jobs');
  c.appendChild(seeAll);
}

function insightTiles(s) {
  const tiles = [];
  const add = (ico, bg, t, sub) => {
    const e = el('div', 'insight');
    e.innerHTML = `<div class="insight-ico ${bg}">${ico}</div><div class="insight-txt"><div class="t">${t}</div><div class="s">${sub}</div></div>`;
    tiles.push(e);
  };

  if (s.change !== null && s.lastWeek > 0) {
    if (s.change >= 0) add('📈', 'bg-green', `עלייה של ${s.change}% מהשבוע שעבר`, `${money(s.thisWeek)} השבוע לעומת ${money(s.lastWeek)}`);
    else add('📉', 'bg-red', `ירידה של ${Math.abs(s.change)}% מהשבוע שעבר`, `${money(s.thisWeek)} השבוע לעומת ${money(s.lastWeek)}`);
  }
  if (s.bestDay !== null && s.bestDayVal > 0) add('📅', 'bg-blue', `יום ${DAY_NAMES[s.bestDay]} הכי רווחי לך`, `סה״כ ${money(s.bestDayVal)} בימי ${DAY_NAMES[s.bestDay]}`);
  if (s.topClient) add('👤', 'bg-purple', `הלקוח הכי רווחי: ${s.topClient[0]}`, `${money(s.topClient[1])} סה״כ`);
  if (s.unpaid > 0) add('⏳', 'bg-amber', `${money(s.unpaid)} עדיין לא שולמו`, `${jobs.filter(j => !j.paid).length} עבודות ממתינות לתשלום`);
  if (s.hourlyRate > 0) add('⏱️', 'bg-blue', `שכר שעתי ממוצע: ${money(s.hourlyRate)} לשעה`, `על סמך ${Math.round(s.totalHours)} שעות שרשמת`);
  if (s.totalExpenses > 0) add('🧾', 'bg-amber', `רווח נטו: ${money(s.netTotal)}`, `${money(s.total)} הכנסות פחות ${money(s.totalExpenses)} הוצאות`);

  // goal nudge
  const closest = goals.map(g => ({ g, left: (g.target || 0) - goalSaved(g), pct: goalSaved(g) / (g.target || 1) }))
    .filter(x => x.left > 0).sort((a, b) => b.pct - a.pct)[0];
  if (closest) add(closest.g.emoji, 'bg-green', `עוד ${money(closest.left)} ל"${closest.g.name}"`, `כבר חסכת ${Math.round(closest.pct * 100)}% מהמטרה`);

  if (!tiles.length) add('✨', 'bg-green', 'הוסף עוד עבודות', 'ככל שתרשום יותר, כך התובנות ידייקו');
  return tiles;
}

function paymentsAlertCard(s) {
  if (!s.unpaidJobs.length) return null;
  const card = el('div', 'card alert-card');
  const overdue = s.unpaidJobs.filter(j => daysAgo(j.date) >= 14);
  const head = overdue.length
    ? `<b>⏳ ${money(s.unpaid)} ממתינים לתשלום</b><div class="alert-sub">${overdue.length} עבודות באיחור (מעל שבועיים)</div>`
    : `<b>⏳ ${money(s.unpaid)} ממתינים לתשלום</b><div class="alert-sub">${s.unpaidJobs.length} עבודות שטרם שולמו</div>`;
  card.innerHTML = `<div class="alert-head">${head}</div>`;

  const list = el('div', 'pay-list');
  s.unpaidJobs.slice(0, 3).forEach(j => {
    const late = daysAgo(j.date) >= 14;
    const row = el('div', 'pay-row');
    row.innerHTML = `
      <div class="pay-main">
        <div class="pay-title">${escAttr(j.title) || 'עבודה'}${late ? ' <span class="late-badge">באיחור</span>' : ''}</div>
        <div class="pay-sub">${j.client ? escAttr(j.client) + ' · ' : ''}${niceDate(j.date)} · ${money(j.amount)}</div>
      </div>
      <button class="pay-btn" data-pay="${j.id}">שולם ✓</button>`;
    row.querySelector('[data-pay]').onclick = () => markPaid(j.id);
    list.appendChild(row);
  });
  card.appendChild(list);

  if (s.unpaidJobs.length > 3) {
    const more = el('button', 'link-btn', `לכל ${s.unpaidJobs.length} התשלומים הממתינים ←`);
    more.style.cssText = 'display:block;margin:4px auto 0';
    more.onclick = () => { jobFilter = 'unpaid'; nav('jobs'); };
    card.appendChild(more);
  }
  return card;
}

function markPaid(id) {
  const j = jobs.find(x => x.id === id);
  if (j) { j.paid = true; persist(); renderAll(); toast('סומן כשולם ✓ 🎉'); }
}

/* ---------- INSIGHTS ---------- */
function renderInsights() {
  const c = inner('insights'); c.innerHTML = '';
  if (jobs.length === 0) {
    c.appendChild(emptyState('📊', 'אין עדיין נתונים', 'הוסף כמה עבודות וכאן יופיעו גרפים ותובנות על ההכנסות שלך.', 'הוספת עבודה', () => openJobSheet()));
    return;
  }
  const s = stats();

  // Summary strip
  const strip = el('div', 'card');
  strip.style.cssText = 'display:flex;text-align:center;padding:16px 8px';
  strip.innerHTML = `
    <div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--green)">${moneyShort(s.total)}</div><div style="font-size:12px;color:var(--text-soft)">סה״כ הכנסות</div></div>
    <div style="flex:1;border-inline:1px solid var(--border)"><div style="font-size:22px;font-weight:900">${jobs.length}</div><div style="font-size:12px;color:var(--text-soft)">עבודות</div></div>
    <div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--amber)">${moneyShort(s.unpaid)}</div><div style="font-size:12px;color:var(--text-soft)">ממתין</div></div>`;
  c.appendChild(strip);

  // Net / hourly strip (only if the user tracks expenses or hours)
  if (s.totalExpenses > 0 || s.hourlyRate > 0) {
    const strip2 = el('div', 'card');
    strip2.style.cssText = 'display:flex;text-align:center;padding:16px 8px';
    const cells = [];
    cells.push(`<div style="flex:1"><div style="font-size:22px;font-weight:900;color:var(--green)">${moneyShort(s.netTotal)}</div><div style="font-size:12px;color:var(--text-soft)">רווח נטו</div></div>`);
    if (s.totalExpenses > 0) cells.push(`<div style="flex:1;border-inline-start:1px solid var(--border)"><div style="font-size:22px;font-weight:900;color:var(--red)">${moneyShort(s.totalExpenses)}</div><div style="font-size:12px;color:var(--text-soft)">הוצאות</div></div>`);
    if (s.hourlyRate > 0) cells.push(`<div style="flex:1;border-inline-start:1px solid var(--border)"><div style="font-size:22px;font-weight:900;color:var(--blue)">${moneyShort(s.hourlyRate)}</div><div style="font-size:12px;color:var(--text-soft)">לשעה</div></div>`);
    strip2.innerHTML = cells.join('');
    c.appendChild(strip2);
  }

  // Monthly report (with navigation, CSV export, WhatsApp share)
  c.appendChild(monthlyReportCard());

  // 6-week trend
  c.appendChild(weeklyTrendChart());
  // by weekday
  c.appendChild(weekdayChart(s));
  // top clients
  c.appendChild(topClientsChart(s));
  // paid vs unpaid
  c.appendChild(paidDonut(s));
}

function weeklyTrendChart() {
  const card = el('div', 'chart-card');
  const weeks = [];
  for (let i = 5; i >= 0; i--) {
    const { start } = weekRange(-i);
    weeks.push({ label: `${start.getDate()}/${start.getMonth() + 1}`, val: weekTotal(-i), isNow: i === 0 });
  }
  const max = Math.max(1, ...weeks.map(w => w.val));
  const avg = sum(weeks, w => w.val) / weeks.length;
  let bars = '';
  weeks.forEach(w => {
    const h = Math.round(w.val / max * 100);
    bars += `<div class="bar-col">
      <div class="bar-val">${w.val ? moneyShort(w.val) : ''}</div>
      <div class="bar ${w.isNow ? '' : 'dim'}" style="height:${h}%"></div>
      <div class="bar-lbl">${w.label}</div></div>`;
  });
  card.innerHTML = `<div class="chart-title">מגמת הכנסה — 6 שבועות</div>
    <div class="chart-note">ממוצע שבועי: ${money(avg)}</div>
    <div class="bar-chart">${bars}</div>`;
  return card;
}

function weekdayChart(s) {
  const card = el('div', 'chart-card');
  const max = Math.max(1, ...s.byDay);
  let bars = '';
  for (let i = 0; i < 7; i++) {
    const h = Math.round(s.byDay[i] / max * 100);
    const best = i === s.bestDay && s.bestDayVal > 0;
    bars += `<div class="bar-col">
      <div class="bar-val">${s.byDay[i] ? moneyShort(s.byDay[i]) : ''}</div>
      <div class="bar ${best ? '' : 'dim'}" style="height:${h}%"></div>
      <div class="bar-lbl">${DAY_SHORT[i]}</div></div>`;
  }
  card.innerHTML = `<div class="chart-title">הכנסה לפי יום בשבוע</div>
    <div class="chart-note">${s.bestDay !== null && s.bestDayVal > 0 ? `יום ${DAY_NAMES[s.bestDay]} הכי רווחי לך` : 'כל הימים'}</div>
    <div class="bar-chart">${bars}</div>`;
  return card;
}

function topClientsChart(s) {
  const card = el('div', 'chart-card');
  const top = s.clientArr.slice(0, 5);
  const max = Math.max(1, ...top.map(c => c[1]));
  const colors = ['var(--green)', 'var(--blue)', 'var(--purple)', 'var(--amber)', 'var(--red)'];
  let rows = '';
  top.forEach((c, i) => {
    const w = Math.max(14, Math.round(c[1] / max * 100));
    rows += `<div class="hbar-row">
      <div class="hbar-name">${c[0]}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${colors[i]}">${w > 30 ? money(c[1]) : ''}</div></div>
      <div class="hbar-val">${w <= 30 ? money(c[1]) : ''}</div></div>`;
  });
  card.innerHTML = `<div class="chart-title">לקוחות מובילים</div>
    <div class="chart-note">מי מכניס לך הכי הרבה</div>${rows}`;
  return card;
}

function paidDonut(s) {
  const card = el('div', 'chart-card');
  const paid = s.total - s.unpaid;
  const total = s.total || 1;
  const paidPct = paid / total;
  const r = 45, C = 2 * Math.PI * r;
  const paidLen = C * paidPct;
  card.innerHTML = `
    <div class="chart-title">שולם מול ממתין</div>
    <div class="chart-note">מצב התשלומים שלך</div>
    <div class="donut-wrap">
      <svg class="donut" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--amber)" stroke-width="16"/>
        <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--green)" stroke-width="16"
          stroke-dasharray="${paidLen} ${C}" stroke-dashoffset="0"
          transform="rotate(-90 60 60)" stroke-linecap="round"/>
        <text x="60" y="56" text-anchor="middle" font-size="20" font-weight="900" fill="var(--text)">${Math.round(paidPct * 100)}%</text>
        <text x="60" y="74" text-anchor="middle" font-size="10" fill="var(--text-soft)">שולם</text>
      </svg>
      <div class="donut-legend">
        <div class="legend-row"><span class="legend-dot" style="background:var(--green)"></span> שולם <b>${money(paid)}</b></div>
        <div class="legend-row"><span class="legend-dot" style="background:var(--amber)"></span> ממתין <b>${money(s.unpaid)}</b></div>
      </div>
    </div>`;
  return card;
}

/* ---------- Monthly report ---------- */
let reportMonth = new Date();

function monthJobs(y, m) {
  return jobs.filter(j => { const d = parseISO(j.date); return d.getFullYear() === y && d.getMonth() === m; });
}

function monthlyReportCard() {
  const y = reportMonth.getFullYear(), m = reportMonth.getMonth();
  const mj = monthJobs(y, m);
  const income = sum(mj, j => Number(j.amount) || 0);
  const exp = sum(mj, j => Number(j.expenses) || 0);
  const net = income - exp;
  const unpaid = sum(mj.filter(j => !j.paid), j => Number(j.amount) || 0);

  const now = new Date();
  const isFuture = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());

  const card = el('div', 'chart-card');
  card.innerHTML = `
    <div class="mr-nav">
      <button class="mr-arrow" id="mr-prev">›</button>
      <div class="mr-title"><div class="chart-title">דוח חודשי</div><div class="mr-month">${MONTHS_FULL[m]} ${y}</div></div>
      <button class="mr-arrow ${isFuture ? 'disabled' : ''}" id="mr-next">‹</button>
    </div>
    <div class="mr-grid">
      <div class="mr-stat"><div class="mr-v" style="color:var(--green)">${money(income)}</div><div class="mr-l">הכנסות</div></div>
      <div class="mr-stat"><div class="mr-v">${mj.length}</div><div class="mr-l">עבודות</div></div>
      <div class="mr-stat"><div class="mr-v" style="color:var(--green-dark)">${money(net)}</div><div class="mr-l">רווח נטו</div></div>
      <div class="mr-stat"><div class="mr-v" style="color:var(--amber)">${money(unpaid)}</div><div class="mr-l">ממתין</div></div>
    </div>
    <div class="row2" style="margin-top:6px">
      <button class="btn btn-ghost btn-sm" id="mr-share" style="flex:1">📤 שיתוף בוואטסאפ</button>
      <button class="btn btn-ghost btn-sm" id="mr-csv" style="flex:1">📄 ייצוא לאקסל</button>
    </div>`;

  card.querySelector('#mr-prev').onclick = () => { reportMonth = new Date(y, m - 1, 1); renderInsights(); };
  const next = card.querySelector('#mr-next');
  if (!isFuture) next.onclick = () => { reportMonth = new Date(y, m + 1, 1); renderInsights(); };
  card.querySelector('#mr-share').onclick = () => openShareSheet(monthReportText(y, m));
  card.querySelector('#mr-csv').onclick = () => exportMonthCSV(y, m);
  return card;
}

function monthReportText(y, m) {
  const mj = monthJobs(y, m);
  const income = sum(mj, j => Number(j.amount) || 0);
  const exp = sum(mj, j => Number(j.expenses) || 0);
  const unpaid = sum(mj.filter(j => !j.paid), j => Number(j.amount) || 0);
  const byClient = {};
  mj.forEach(j => { const c = (j.client || '').trim() || 'ללא לקוח'; byClient[c] = (byClient[c] || 0) + (Number(j.amount) || 0); });
  const clientLines = Object.entries(byClient).sort((a, b) => b[1] - a[1]).map(([c, v]) => `• ${c}: ${money(v)}`).join('\n');

  let t = `📊 דוח ${MONTHS_FULL[m]} ${y} — רווח\n`;
  t += `━━━━━━━━━━━━━━\n`;
  t += `💰 הכנסות: ${money(income)}\n`;
  if (exp > 0) { t += `🧾 הוצאות: ${money(exp)}\n`; t += `✅ רווח נטו: ${money(income - exp)}\n`; }
  t += `📋 עבודות: ${mj.length}\n`;
  if (unpaid > 0) t += `⏳ ממתין לתשלום: ${money(unpaid)}\n`;
  if (clientLines) t += `\nלפי לקוח:\n${clientLines}\n`;
  return t;
}

function exportMonthCSV(y, m) {
  const mj = [...monthJobs(y, m)].sort((a, b) => a.date.localeCompare(b.date));
  if (!mj.length) { toast('אין עבודות בחודש הזה'); return; }
  const rows = [['תאריך', 'מה עשיתי', 'לקוח', 'סכום', 'שעות', 'הוצאות', 'נטו', 'סטטוס']];
  mj.forEach(j => rows.push([j.date, j.title || '', j.client || '', j.amount || 0, j.hours || '', j.expenses || '', jobNet(j), j.paid ? 'שולם' : 'ממתין']));
  const income = sum(mj, j => Number(j.amount) || 0);
  rows.push([]);
  rows.push(['סה״כ', '', '', income, '', sum(mj, j => Number(j.expenses) || 0), sum(mj, j => jobNet(j)), '']);
  downloadFile(csvString(rows), `revach-${y}-${String(m + 1).padStart(2, '0')}.csv`, 'text/csv;charset=utf-8');
  toast('הקובץ הורד — נפתח באקסל ✓');
}

function csvString(rows) {
  return '﻿' + rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
}
function downloadFile(content, name, type) {
  try {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { toast('הורדה נחסמה בדפדפן הזה'); }
}

function openShareSheet(text) {
  openSheet(`
    <div class="sheet-title">📤 שיתוף הדוח</div>
    <pre class="report-preview">${escAttr(text)}</pre>
    <a class="btn btn-primary mt8" id="sh-wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">שיתוף בוואטסאפ</a>
    <button class="btn btn-ghost mt8" id="sh-copy">העתקת הטקסט</button>
  `);
  $('#sh-copy').onclick = async () => {
    try { await navigator.clipboard.writeText(text); toast('הועתק ✓'); }
    catch (e) { toast('לא ניתן להעתיק — סמן והעתק ידנית'); }
  };
}

/* ---------- GOALS ---------- */
function renderGoals() {
  const c = inner('goals'); c.innerHTML = '';

  const head = el('div', '');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:4px 4px 14px';
  head.innerHTML = `<div style="font-size:22px;font-weight:900">🎯 המטרות שלי</div>`;
  const addBtn = el('button', 'btn btn-primary btn-sm', '+ מטרה');
  addBtn.onclick = () => openGoalSheet();
  head.appendChild(addBtn);
  c.appendChild(head);

  if (goals.length === 0) {
    c.appendChild(emptyState('🎯', 'הגדר מטרה ראשונה',
      'חופשה? פלייסטיישן? טיול לירושלים? הגדר מטרה, ובחר כמה מכל עבודה יילך אליה. נעקוב אחרי ההתקדמות בשבילך.',
      'יצירת מטרה', () => openGoalSheet()));
    return;
  }

  goals.forEach(g => c.appendChild(goalCard(g)));

  const totalAlloc = goals.filter(g => g.type === 'percent').reduce((s, g) => s + Number(g.value), 0);
  if (totalAlloc > 100) {
    const warn = el('div', 'card');
    warn.style.cssText = 'background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600';
    warn.innerHTML = `⚠️ סך ההקצאות באחוזים הוא ${totalAlloc}% — יותר מ-100% מההכנסה. זה בסדר למעקב, אבל שים לב שלא כל הכסף באמת קיים פעמיים.`;
    c.appendChild(warn);
  }
}

function goalCard(g) {
  const saved = goalSaved(g);
  const target = Number(g.target) || 0;
  const pct = Math.min(100, Math.round(saved / (target || 1) * 100));
  const left = Math.max(0, target - saved);
  const done = saved >= target && target > 0;

  const card = el('div', 'goal-card');
  const allocLabel = g.type === 'percent' ? `${g.value}% מכל עבודה` : `${money(g.value)} מכל עבודה`;

  // ETA
  let etaHtml = '';
  if (!done && left > 0) {
    const wc = weeklyContribution(g);
    if (wc > 0) {
      const weeksLeft = Math.ceil(left / wc);
      const eta = addDays(new Date(), weeksLeft * 7);
      etaHtml = `<div class="goal-eta">⏱️ בקצב הנוכחי: עוד כ-${weeksLeft} ${weeksLeft === 1 ? 'שבוע' : 'שבועות'} (${eta.getDate()} ב${MONTHS[eta.getMonth()]})</div>`;
    }
  }

  card.innerHTML = `
    <div class="goal-top">
      <div class="goal-emoji">${g.emoji}</div>
      <div style="flex:1;min-width:0">
        <div class="goal-name">${g.name}</div>
        <div class="goal-meta">${allocLabel}</div>
      </div>
      ${done ? '<span class="goal-done-badge">הושג! 🎉</span>' : '<button class="goal-del" data-del="' + g.id + '">🗑️</button>'}
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="goal-nums"><span class="saved">${money(saved)} ${done ? '' : `(${pct}%)`}</span><span class="left">${done ? 'מוכן!' : `מתוך ${money(target)}`}</span></div>
    ${etaHtml}`;

  const del = card.querySelector('[data-del]');
  if (del) del.onclick = () => { if (confirm(`למחוק את המטרה "${g.name}"?`)) { goals = goals.filter(x => x.id !== g.id); persist(); renderAll(); toast('המטרה נמחקה'); } };
  return card;
}

function renderJobs() {
  const c = inner('jobs'); c.innerHTML = '';
  const head = el('div', '');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:4px 4px 14px';
  head.innerHTML = `<div style="font-size:22px;font-weight:900">📋 העבודות שלי</div>`;
  const addBtn = el('button', 'btn btn-primary btn-sm', '+ עבודה');
  addBtn.onclick = () => openJobSheet();
  head.appendChild(addBtn);
  c.appendChild(head);

  if (jobs.length === 0) {
    c.appendChild(emptyState('📋', 'עוד לא רשמת עבודות', 'רשום מה עשית, למי, וכמה הרווחת — לוקח 10 שניות.', 'הוספת עבודה', () => openJobSheet()));
    return;
  }

  // filter chips
  const unpaidCount = jobs.filter(j => !j.paid).length;
  const filters = el('div', 'chips');
  filters.style.marginBottom = '14px';
  filters.innerHTML = `
    <button class="chip ${jobFilter === 'all' ? 'chip-on' : ''}" data-f="all">הכל (${jobs.length})</button>
    <button class="chip ${jobFilter === 'unpaid' ? 'chip-on' : ''}" data-f="unpaid">ממתין לתשלום (${unpaidCount})</button>`;
  filters.querySelectorAll('.chip').forEach(ch => ch.onclick = () => { jobFilter = ch.dataset.f; renderJobs(); });
  c.appendChild(filters);

  let list = [...jobs].sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  if (jobFilter === 'unpaid') list = list.filter(j => !j.paid);

  if (!list.length) {
    c.appendChild(el('div', 'empty', '<div class="empty-emoji">✅</div><div class="empty-title">אין תשלומים ממתינים</div><div class="empty-text">כל העבודות שולמו. כל הכבוד!</div>'));
    return;
  }

  let lastGroup = '';
  list.forEach(j => {
    const g = niceDate(j.date);
    if (g !== lastGroup) { c.appendChild(el('div', 'date-group-label', g)); lastGroup = g; }
    c.appendChild(jobRow(j, true, true));
  });
}

function jobRow(j, tappable, showPay) {
  const row = el('div', 'job-row');
  const initial = (j.title || '?').trim().charAt(0) || '💼';
  const meta = [];
  if (j.client) meta.push(escAttr(j.client));
  meta.push(niceDate(j.date));
  if (Number(j.hours) > 0) meta.push(`${j.hours} ש׳`);
  const payBtn = (showPay && !j.paid) ? `<button class="row-pay" data-pay="${j.id}" aria-label="סמן כשולם">✓</button>` : '';
  row.innerHTML = `
    <div class="job-avatar">${initial}</div>
    <div class="job-main">
      <div class="job-title">${escAttr(j.title) || 'עבודה'}</div>
      <div class="job-sub">${meta.join(' · ')}</div>
    </div>
    <div class="job-right">
      <div class="job-amount">${money(j.amount)}</div>
      <span class="status-chip ${j.paid ? 'status-paid' : 'status-unpaid'}">${j.paid ? 'שולם' : 'ממתין'}</span>
    </div>
    ${payBtn}`;
  const pb = row.querySelector('[data-pay]');
  if (pb) pb.onclick = (e) => { e.stopPropagation(); markPaid(j.id); };
  if (tappable) row.onclick = () => openJobSheet(j);
  return row;
}

/* ---------- Empty state ---------- */
function emptyState(emoji, title, text, btnLabel, onClick) {
  const e = el('div', 'empty');
  e.innerHTML = `<div class="empty-emoji">${emoji}</div><div class="empty-title">${title}</div><div class="empty-text">${text}</div>`;
  if (btnLabel) {

    b.style.maxWidth = '260px'; b.style.margin = '0 auto';
    b.onclick = onClick;
    e.appendChild(b);
  }
  return e;
}

    </div>

      </div>

        <label>סטטוס תשלום</label>
        <div class="toggle-group">

      <div class="field">
        <label>שעות עבודה <span class="opt">לא חובה</span></label>
        <input type="number" id="f-hours" inputmode="decimal" placeholder="0" value="${j.hours || ''}" />
      </div>
      <div class="field">
        <label>הוצאות ${CUR()} <span class="opt">לא חובה</span></label>
        <input type="number" id="f-expenses" inputmode="decimal" placeholder="0" value="${j.expenses || ''}" />
      </div>
    </div>

    ${isEdit ? '<button class="btn btn-danger mt8" id="f-delete">מחיקת עבודה</button>' : ''}
  `);

  const updateNetHint = () => {
    const a = parseFloat($('#f-amount').value) || 0;
    const ex = parseFloat($('#f-expenses').value) || 0;
    const h = parseFloat($('#f-hours').value) || 0;
    const parts = [];
    if (ex > 0) parts.push(`רווח נטו: ${money(a - ex)}`);
    if (h > 0 && a > 0) parts.push(`${money(a / h)} לשעה`);
    $('#f-net-hint').textContent = parts.join(' · ');

  ['#f-amount', '#f-expenses', '#f-hours'].forEach(id => $(id).addEventListener('input', updateNetHint));

  let paid = j.paid;
  $('#t-paid').onclick = () => { paid = true; $('#t-paid').classList.add('on'); $('#t-unpaid').classList.remove('on'); };

      <div class="hint" id="g-hint">מכל עבודה, 10% ילכו למטרה הזו.</div>
    </div>
    <button class="btn btn-primary mt8" id="g-save">יצירת מטרה</button>
  `);

  let emoji = GOAL_EMOJIS[0], type = 'percent';
  const grid = $('#emoji-grid');
  grid.querySelectorAll('.emoji-opt').forEach(b => b.onclick = () => {
    grid.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); emoji = b.dataset.e;
  });

  const updateHint = () => {
    const v = $('#g-value').value || (type === 'percent' ? '10' : '100');
    $('#g-hint').textContent = type === 'percent'
      ? `מכל עבודה, ${v}% ילכו למטרה הזו.`
      : `מכל עבודה, ${money(v)} ילכו למטרה הזו.`;
    $('#g-val-cur').textContent = type === 'percent' ? '%' : CUR();
  };
  $('#g-type-percent').onclick = () => { type = 'percent'; $('#g-type-percent').classList.add('on'); $('#g-type-fixed').classList.remove('on'); updateHint(); };
  $('#g-type-fixed').onclick = () => { type = 'fixed'; $('#g-type-fixed').classList.add('on'); $('#g-type-percent').classList.remove('on'); updateHint(); };
  $('#g-value').oninput = updateHint;

  $('#g-save').onclick = () => {
    const name = $('#g-name').value.trim();
    const target = parseFloat($('#g-target').value);
    const value = parseFloat($('#g-value').value);
    if (!name) { toast('תן שם למטרה'); $('#g-name').focus(); return; }
    if (!target || target <= 0) { toast('הכנס יעד סכום'); $('#g-target').focus(); return; }
    if (!value || value <= 0) { toast('כמה להקצות מכל עבודה?'); $('#g-value').focus(); return; }
    goals.push({ id: uid(), name, emoji, target, type, value, created: Date.now() });
    persist(); closeSheet(); renderAll(); toast(`המטרה "${name}" נוצרה 🎯`);
  };

  setTimeout(() => $('#g-name').focus(), 350);
}

/* ----- Settings sheet ----- */
function openSettings() {
  openSheet(`
    <div class="sheet-title">⚙️ הגדרות</div>
    <div class="field">
      <label>יעד הכנסה שבועי (אופציונלי)</label>
      <div class="amount-input-wrap">
        <span class="cur">${CUR()}</span>
        <input type="number" id="s-weekly" inputmode="decimal" placeholder="0" value="${settings.weeklyGoal || ''}" />
      </div>
      <div class="hint">נראה לך התקדמות ליעד במסך הבית.</div>
    </div>
    <div class="field">
      <label>מטבע</label>
      <select id="s-cur">
        ${['₪', '$', '€', '£'].map(c => `<option ${c === CUR() ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-primary mt8" id="s-save">שמירה</button>
    <button class="btn btn-ghost mt8" id="s-export">ייצוא נתונים (גיבוי)</button>
    <button class="btn btn-danger mt16" id="s-reset">איפוס — מחיקת כל הנתונים</button>
    <div class="hint center mt16">הנתונים נשמרים על המכשיר הזה בלבד. רווח · גרסה 1.0</div>
  `);

  $('#s-save').onclick = () => {
    settings.weeklyGoal = parseFloat($('#s-weekly').value) || 0;
    settings.currency = $('#s-cur').value;
    persist(); closeSheet(); renderAll(); toast('נשמר ✓');
  };
  $('#s-export').onclick = () => {
    const data = JSON.stringify({ jobs, goals, settings }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `revach-backup-${todayISO()}.json`; a.click();
    toast('הגיבוי הורד ✓');
  };
  $('#s-reset').onclick = () => {
    if (confirm('למחוק את כל העבודות והמטרות? אי אפשר לבטל.')) {
      jobs = []; goals = []; settings = { weeklyGoal: 0, currency: CUR() };
      persist(); closeSheet(); renderAll(); toast('הכל אופס');
    }
  };
}

/* ==========================================================
   Navigation, toast, misc
   ========================================================== */
let current = 'home';
let jobFilter = 'all';
function nav(screen) {
  current = screen;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.dataset.screen !== screen));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === screen));
  renderScreen(screen);
  window.scrollTo(0, 0);
}
function renderScreen(screen) {
  ({ home: renderHome, insights: renderInsights, goals: renderGoals, jobs: renderJobs }[screen] || renderHome)();
}
function renderAll() { renderScreen(current); }

document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => nav(b.dataset.nav));
$('#fabAdd').onclick = () => openJobSheet();
$('#settingsBtn').onclick = openSettings;

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hidden');
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.classList.add('hidden'), 250); }, 2200);
}

// celebrate reaching a goal after adding a job
let prevDone = new Set();
function snapshotDone() { prevDone = new Set(goals.filter(g => goalSaved(g) >= g.target && g.target > 0).map(g => g.id)); }
function celebrateGoals() {
  goals.forEach(g => {
    const done = goalSaved(g) >= g.target && g.target > 0;
    if (done && !prevDone.has(g.id)) { setTimeout(() => toast(`🎉 הגעת למטרה "${g.name}"!`), 1200); }
  });
  snapshotDone();
}

function escAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
