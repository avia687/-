<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מעקב הכנסות</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f0efe9;
    --ink: #13201b;
    --muted: #66716a;
    --line: #e2e1d8;
    --accent: #0f9d6b;
    --accent-soft: #e4f4ec;
    --accent-ink: #0a6e4a;
    --gold: #c98a2b;
    --gold-soft: #f7ecd8;
    --danger: #c8452f;
    --shadow: 0 1px 2px rgba(19,32,27,.04), 0 8px 24px rgba(19,32,27,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1613;
      --surface: #16211d;
      --surface-2: #1d2a25;
      --ink: #eaf2ee;
      --muted: #93a29a;
      --line: #26332d;
      --accent: #2bb884;
      --accent-soft: #16332a;
      --accent-ink: #7fe0bb;
      --gold: #dba94f;
      --gold-soft: #322a1a;
      --danger: #e2684f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0efe9; --ink: #13201b;
    --muted: #66716a; --line: #e2e1d8; --accent: #0f9d6b; --accent-soft: #e4f4ec;
    --accent-ink: #0a6e4a; --gold: #c98a2b; --gold-soft: #f7ecd8; --danger: #c8452f;
    --shadow: 0 1px 2px rgba(19,32,27,.04), 0 8px 24px rgba(19,32,27,.06);
  }
  :root[data-theme="dark"] {
    --bg: #0e1613; --surface: #16211d; --surface-2: #1d2a25; --ink: #eaf2ee;
    --muted: #93a29a; --line: #26332d; --accent: #2bb884; --accent-soft: #16332a;
    --accent-ink: #7fe0bb; --gold: #dba94f; --gold-soft: #322a1a; --danger: #e2684f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, "Segoe UI", Rubik, Assistant, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 72px; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* Header */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 26px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(150deg, var(--accent), var(--accent-ink));
    display: grid; place-items: center; color: #fff; flex: none;
    box-shadow: var(--shadow);
  }
  .mark svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .head-actions { display: flex; gap: 8px; align-items: center; }

  /* Buttons */
  button, .btn {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 9px 14px;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { border-color: var(--muted); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .btn-ghost { background: transparent; }
  .icon-btn { padding: 8px 10px; line-height: 0; }

  /* KPI row */
  .kpis {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 27px; font-weight: 700; margin-top: 8px; letter-spacing: -.02em; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .kpi.accent { background: linear-gradient(160deg, var(--accent-soft), var(--surface)); }
  .kpi.accent .value { color: var(--accent-ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

  /* Cards / grid */
  .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; align-items: start; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-h { padding: 16px 18px 0; display:flex; justify-content: space-between; align-items:center; gap: 10px; }
  .card-h h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .card-h .hint { font-size: 12px; color: var(--muted); }
  .card-b { padding: 16px 18px 18px; }

  /* Form */
  form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); font-weight: 500; }
  input, select {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); width: 100%;
  }
  input::placeholder { color: var(--muted); opacity: .8; }

  /* Chart */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 168px; padding-top: 8px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .bar-track { width: 100%; height: 132px; display: flex; align-items: flex-end; }
  .bar {
    width: 100%; border-radius: 7px 7px 3px 3px; min-height: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-ink));
    transition: height .5s cubic-bezier(.2,.7,.2,1);
    position: relative;
  }
  .bar.cur { background: linear-gradient(180deg, var(--gold), #a86e1c); }
  .bar-val { font-size: 11px; color: var(--muted); }
  .bar-lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* Category breakdown */
  .cats { display: flex; flex-direction: column; gap: 12px; }
  .cat-row { display: flex; flex-direction: column; gap: 6px; }
  .cat-top { display: flex; justify-content: space-between; font-size: 13px; }
  .cat-top .nm { display: flex; align-items: center; gap: 7px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .cat-bar { height: 8px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .cat-fill { height: 100%; border-radius: 5px; transition: width .5s ease; }

  /* List / table */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar select { width: auto; }
  .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; }
  th { text-align: right; font-size: 11.5px; color: var(--muted); font-weight: 600;
       padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em;}
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .amt { font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink);
    white-space: nowrap;
  }
  .chip .swatch { width: 8px; height: 8px; }
  .row-act { display: flex; gap: 4px; justify-content: flex-start; }
  .row-act button { padding: 5px 8px; font-size: 12px; }
  .del:hover { border-color: var(--danger); color: var(--danger); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 10px; }

  footer.foot { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    form.add { grid-template-columns: 1fr; }
    .kpi .value { font-size: 23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-5 4 4 8-8"/><path d="M16 8h4v4"/>
        </svg>
      </div>
      <div>
        <h1>מעקב הכנסות</h1>
        <p>נהל את ההכנסות שלך במקום אחד</p>
      </div>
    </div>
    <div class="head-actions">
      <button id="themeBtn" class="icon-btn btn-ghost" title="החלף מצב תצוגה" aria-label="החלף מצב תצוגה">🌗</button>
      <button id="exportBtn" class="btn-ghost">ייצוא</button>
      <button id="importBtn" class="btn-ghost">ייבוא</button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <div style="display:flex; flex-direction:column; gap:18px;">
      <!-- Add form -->
      <div class="card">
        <div class="card-h"><h2>הוספת הכנסה</h2><span class="hint">כל הסכומים ב-₪</span></div>
        <div class="card-b">
          <form class="add" id="addForm">
            <div class="field">
              <label for="f-amount">סכום</label>
              <input id="f-amount" class="num" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required />
            </div>
            <div class="field">
              <label for="f-date">תאריך</label>
              <input id="f-date" type="date" required />
            </div>
            <div class="field full">
              <label for="f-desc">תיאור / מקור</label>
              <input id="f-desc" type="text" placeholder="לדוגמה: מכירת יום ראשון, תשלום מלקוח…" maxlength="80" />
            </div>
            <div class="field">
              <label for="f-cat">קטגוריה</label>
              <select id="f-cat"></select>
            </div>
            <div class="field" style="justify-content:flex-end;">
              <button type="submit" class="btn-primary" id="submitBtn">הוסף הכנסה</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Entries -->
      <div class="card">
        <div class="card-h"><h2>תנועות</h2><span class="hint" id="countHint"></span></div>
        <div class="card-b">
          <div class="toolbar">
            <select id="monthFilter" aria-label="סינון לפי חודש"></select>
            <select id="catFilter" aria-label="סינון לפי קטגוריה"></select>
            <div class="spacer"></div>
          </div>
          <div class="table-scroll">
            <table id="entriesTable">
              <thead>
                <tr>
                  <th>תאריך</th><th>תיאור</th><th>קטגוריה</th><th>סכום</th><th></th>
                </tr>
              </thead>
              <tbody id="entriesBody"></tbody>
            </table>
          </div>
          <div class="empty" id="emptyState" hidden>
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 4-5"/></svg>
              <div>אין עדיין הכנסות. הוסף את הראשונה למעלה 👆</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:18px;">
      <!-- Chart -->
      <div class="card">
        <div class="card-h"><h2>הכנסה חודשית</h2><span class="hint">6 חודשים אחרונים</span></div>
        <div class="card-b">
          <div class="chart" id="chart"></div>
        </div>
      </div>
      <!-- Categories -->
      <div class="card">
        <div class="card-h"><h2>פילוח לפי קטגוריה</h2><span class="hint" id="catScope">השנה</span></div>
        <div class="card-b">
          <div class="cats" id="catBreakdown"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">הנתונים נשמרים מקומית בדפדפן שלך בלבד · השתמש בייצוא כדי לגבות</footer>
</div>

<script>
(() => {
  "use strict";
  const STORAGE_KEY = "income-tracker.v1";
  const THEME_KEY = "income-tracker.theme";

  const CATEGORIES = [
    { id: "sales",   name: "מכירות",  color: "#0f9d6b" },
    { id: "service", name: "שירות",   color: "#2f7bd6" },
    { id: "tips",    name: "טיפים",   color: "#c98a2b" },
    { id: "product", name: "מוצרים",  color: "#8a5cd6" },
    { id: "salary",  name: "משכורת",  color: "#0d9488" },
    { id: "other",   name: "אחר",     color: "#94a3b8" },
  ];
  const catById = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];

  // ---- State ----
  let entries = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch {}
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---- Formatting ----
  const nf = new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", minimumFractionDigits: 2 });
  const df = new Intl.DateTimeFormat("he-IL", { day: "2-digit", month: "2-digit", year: "2-digit" });
  const monthKey = d => d.slice(0, 7); // "YYYY-MM"
  const monthLabel = key => {
    const [y, m] = key.split("-");
    return new Intl.DateTimeFormat("he-IL", { month: "short" }).format(new Date(+y, +m - 1, 1));
  };
  const money = (n) => (Math.abs(n) >= 1000 ? nf.format(n) : nf2.format(n));

  // ---- DOM refs ----
  const $ = s => document.querySelector(s);
  const kpis = $("#kpis");
  const chart = $("#chart");
  const catBreakdown = $("#catBreakdown");
  const entriesBody = $("#entriesBody");
  const emptyState = $("#emptyState");
  const monthFilter = $("#monthFilter");
  const catFilter = $("#catFilter");
  const countHint = $("#countHint");
  const table = $("#entriesTable");

  // ---- Populate category selects ----
  const catSelect = $("#f-cat");
  CATEGORIES.forEach(c => {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = c.name; catSelect.appendChild(o);
  });
  $("#f-date").value = new Date().toISOString().slice(0, 10);

  // ---- Render ----
  function render() {
    renderKpis();
    renderChart();
    renderCats();
    renderFilters();
    renderTable();
    save();
  }

  function sum(list) { return list.reduce((a, e) => a + e.amount, 0); }

  function renderKpis() {
    const now = new Date();
    const curMonth = now.toISOString().slice(0, 7);
    const curYear = String(now.getFullYear());
    const thisMonth = sum(entries.filter(e => monthKey(e.date) === curMonth));
    const thisYear = sum(entries.filter(e => e.date.slice(0, 4) === curYear));
    const total = sum(entries);
    const months = new Set(entries.map(e => monthKey(e.date)));
    const avg = months.size ? total / months.size : 0;

    const data = [
      { label: "החודש", val: thisMonth, sub: new Intl.DateTimeFormat("he-IL", { month: "long", year: "numeric" }).format(now), accent: true },
      { label: "השנה", val: thisYear, sub: curYear },
      { label: "סה״כ", val: total, sub: entries.length + " תנועות" },
      { label: "ממוצע חודשי", val: avg, sub: months.size + " חודשים פעילים" },
    ];
    kpis.innerHTML = data.map(d => `
      <div class="kpi ${d.accent ? "accent" : ""}">
        <div class="label">${d.accent ? '<span class="dot"></span>' : ""}${d.label}</div>
        <div class="value num">${money(d.val)}</div>
        <div class="sub">${d.sub}</div>
      </div>`).join("");
  }

  function lastMonths(n) {
    const out = [];
    const d = new Date(); d.setDate(1);
    for (let i = n - 1; i >= 0; i--) {
      const dd = new Date(d.getFullYear(), d.getMonth() - i, 1);
      out.push(dd.toISOString().slice(0, 7));
    }
    return out;
  }

  function renderChart() {
    const keys = lastMonths(6);
    const totals = keys.map(k => sum(entries.filter(e => monthKey(e.date) === k)));
    const max = Math.max(...totals, 1);
    const curMonth = new Date().toISOString().slice(0, 7);
    chart.innerHTML = keys.map((k, i) => {
      const h = Math.round((totals[i] / max) * 100);
      const isCur = k === curMonth;
      return `<div class="bar-col">
        <div class="bar-val num">${totals[i] ? nf.format(totals[i]) : ""}</div>
        <div class="bar-track"><div class="bar ${isCur ? "cur" : ""}" style="height:${totals[i] ? Math.max(h, 3) : 0}%"></div></div>
        <div class="bar-lbl">${monthLabel(k)}</div>
      </div>`;
    }).join("");
  }

  function renderCats() {
    const curYear = String(new Date().getFullYear());
    const scoped = entries.filter(e => e.date.slice(0, 4) === curYear);
    const total = sum(scoped) || 1;
    const byCat = CATEGORIES.map(c => ({
      cat: c,
      val: sum(scoped.filter(e => e.category === c.id)),
    })).filter(x => x.val > 0).sort((a, b) => b.val - a.val);

    if (!byCat.length) {
      catBreakdown.innerHTML = `<div style="color:var(--muted);font-size:13px;">אין נתונים לשנה זו עדיין.</div>`;
      return;
    }
    catBreakdown.innerHTML = byCat.map(x => {
      const pct = Math.round((x.val / total) * 100);
      return `<div class="cat-row">
        <div class="cat-top">
          <span class="nm"><span class="swatch" style="background:${x.cat.color}"></span>${x.cat.name}</span>
          <span class="num">${money(x.val)} · ${pct}%</span>
        </div>
        <div class="cat-bar"><div class="cat-fill" style="width:${pct}%;background:${x.cat.color}"></div></div>
      </div>`;
    }).join("");
  }

  function renderFilters() {
    const months = [...new Set(entries.map(e => monthKey(e.date)))].sort().reverse();
    const prevMonth = monthFilter.value;
    monthFilter.innerHTML = `<option value="">כל החודשים</option>` +
      months.map(m => {
        const [y, mo] = m.split("-");
        const lbl = new Intl.DateTimeFormat("he-IL", { month: "long", year: "numeric" }).format(new Date(+y, +mo - 1, 1));
        return `<option value="${m}">${lbl}</option>`;
      }).join("");
    if ([...monthFilter.options].some(o => o.value === prevMonth)) monthFilter.value = prevMonth;

    const prevCat = catFilter.value;
    catFilter.innerHTML = `<option value="">כל הקטגוריות</option>` +
      CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    catFilter.value = prevCat || "";
  }

  function renderTable() {
    const mf = monthFilter.value, cf = catFilter.value;
    let list = entries.slice();
    if (mf) list = list.filter(e => monthKey(e.date) === mf);
    if (cf) list = list.filter(e => e.category === cf);
    list.sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);

    countHint.textContent = list.length ? `${list.length} תנועות · ${money(sum(list))}` : "";

    if (!list.length) {
      table.hidden = true; emptyState.hidden = false;
      entriesBody.innerHTML = "";
      return;
    }
    table.hidden = false; emptyState.hidden = true;
    entriesBody.innerHTML = list.map(e => {
      const c = catById(e.category);
      const d = new Date(e.date + "T00:00:00");
      return `<tr data-id="${e.id}">
        <td class="num">${df.format(d)}</td>
        <td>${escapeHtml(e.desc) || '<span style="color:var(--muted)">—</span>'}</td>
        <td><span class="chip"><span class="swatch" style="background:${c.color}"></span>${c.name}</span></td>
        <td class="amt num">${nf2.format(e.amount)}</td>
        <td><div class="row-act">
          <button class="del" data-act="del" title="מחק">מחק</button>
        </div></td>
      </tr>`;
    }).join("");
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  // ---- Events ----
  $("#addForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const amount = parseFloat($("#f-amount").value);
    if (!(amount > 0)) { $("#f-amount").focus(); return; }
    entries.push({
      id: uid(),
      amount: Math.round(amount * 100) / 100,
      date: $("#f-date").value,
      desc: $("#f-desc").value.trim(),
      category: $("#f-cat").value,
      created: Date.now(),
    });
    $("#f-amount").value = "";
    $("#f-desc").value = "";
    render();
    $("#f-amount").focus();
  });

  entriesBody.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const tr = ev.target.closest("tr");
    const id = tr && tr.dataset.id;
    if (btn.dataset.act === "del") {
      const e = entries.find(x => x.id === id);
      if (e && confirm(`למחוק הכנסה של ${nf2.format(e.amount)}?`)) {
        entries = entries.filter(x => x.id !== id);
        render();
      }
    }
  });

  monthFilter.addEventListener("change", renderTable);
  catFilter.addEventListener("change", renderTable);

  // Export / Import
  $("#exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `income-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  });
  $("#importBtn").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw new Error();
        const clean = arr.filter(x => x && typeof x.amount === "number" && typeof x.date === "string")
          .map(x => ({
            id: x.id || uid(),
            amount: Math.round(x.amount * 100) / 100,
            date: x.date.slice(0, 10),
            desc: (x.desc || "").toString().slice(0, 80),
            category: catById(x.category).id,
            created: x.created || Date.now(),
          }));
        if (!clean.length) { alert("הקובץ לא מכיל הכנסות תקינות."); return; }
        if (confirm(`לייבא ${clean.length} תנועות? הפעולה תחליף את הנתונים הקיימים.`)) {
          entries = clean; render();
        }
      } catch { alert("קובץ לא תקין. נדרש קובץ JSON שיוצא מהאפליקציה."); }
      ev.target.value = "";
    };
    reader.readAsText(file);
  });

  // Theme toggle
  const rootEl = document.documentElement;
  const savedTheme = (() => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } })();
  if (savedTheme) rootEl.setAttribute("data-theme", savedTheme);
  $("#themeBtn").addEventListener("click", () => {
    const current = rootEl.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    render();
  });

  render();
})();
</script>
</body>
</html>
