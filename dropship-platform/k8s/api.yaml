apiVersion: apps/v1
kind: Deployment
metadata:
  name: dropship-api
  namespace: dropship
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dropship-api
  template:
    metadata:
      labels:
        app: dropship-api
    spec:
      containers:
        - name: api
          image: REGISTRY/dropship-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: dropship-secrets
            - configMapRef:
                name: dropship-config
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dropship-api
  namespace: dropship
spec:
  selector:
    app: dropship-api
  ports:
    - port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dropship-api
  namespace: dropship
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dropship-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
