apiVersion: v1
kind: Namespace
metadata:
  name: dropship
---
# AWS ALB ingress (requires the AWS Load Balancer Controller on EKS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dropship
  namespace: dropship
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dropship-api
                port:
                  number: 80
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dropship-web
                port:
                  number: 80
