# Template — DO NOT commit real secrets. In production use AWS Secrets Manager + External Secrets,
# or `kubectl create secret`. Values here are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: dropship-secrets
  namespace: dropship
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@your-rds-host:5432/dropship?schema=public
  REDIS_URL: redis://your-elasticache-host:6379
  JWT_ACCESS_SECRET: replace-me
  JWT_REFRESH_SECRET: replace-me
  ENCRYPTION_KEY: replace-with-64-hex-chars
  ANTHROPIC_API_KEY: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dropship-config
  namespace: dropship
data:
  NODE_ENV: production
  API_PORT: '4000'
  ANTHROPIC_MODEL: claude-opus-4-8
  CORS_ORIGINS: https://app.example.com
